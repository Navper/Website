      <script>
          document.addEventListener("DOMContentLoaded", function () {

              /* ── Particle background ── */
              (function () {
                  var container = document.getElementById('home-particles');
                  for (var j = 0; j < 38; j++) {
                      var dot = document.createElement('div');
                      dot.classList.add('home-particle');
                      dot.style.left              = Math.random() * 100 + 'vw';
                      dot.style.top               = Math.random() * 100 + 'vh';
                      dot.style.animationDelay    = (Math.random() * 8) + 's';
                      dot.style.animationDuration = (6 + Math.random() * 10) + 's';
                      dot.style.width = dot.style.height = (2 + Math.random() * 3) + 'px';
                      container.appendChild(dot);
                  }
              })();

              /* ── Role rotator ── */
              var roles = {
                  en: [
                      'AI-powered apps',
                      'modern web experiences',
                      'business management tools',
                      'intelligent automation'
                  ],
                  es: [
                      'apps con inteligencia artificial',
                      'experiencias web modernas',
                      'herramientas de gestión empresarial',
                      'automatización inteligente'
                  ]
              };

              var rotatorEl  = document.getElementById('role-rotator-text');
              var roleIndex  = 0;
              var charIndex  = 0;
              var isDeleting = false;

              function getLang() {
                  return (window.i18n && window.i18n.currentLang) ? window.i18n.currentLang : 'en';
              }

              function typeRole() {
                  var lang     = getLang();
                  var list     = roles[lang] || roles.en;
                  var fullText = list[roleIndex % list.length];

                  if (!isDeleting) {
                      charIndex++;
                      rotatorEl.textContent = fullText.substring(0, charIndex);
                      if (charIndex >= fullText.length) {
                          isDeleting = true;
                          setTimeout(typeRole, 2400);
                          return;
                      }
                      setTimeout(typeRole, 72);
                  } else {
                      charIndex--;
                      rotatorEl.textContent = fullText.substring(0, charIndex);
                      if (charIndex === 0) {
                          isDeleting = false;
                          roleIndex++;
                          setTimeout(typeRole, 420);
                          return;
                      }
                      setTimeout(typeRole, 36);
                  }
              }
              setTimeout(typeRole, 1200);

              /* ── CrisChat chatbot ── */
              var input          = document.getElementById('chat-input');
              var chat           = document.getElementById('chat-messages');
              var welcomeMessage = window.i18n ? window.i18n.t('home.welcome') : "Thanks for visiting my site, feel free to ask me anything!";
              var wi = 0;

              function typeWelcome() {
                  if (wi < welcomeMessage.length) {
                      chat.innerHTML = '<p><strong>Cris:<\/strong> ' + welcomeMessage.substring(0, wi + 1) + '<\/p>';
                      wi++;
                      setTimeout(typeWelcome, 28);
                  }
              }
              chat.innerHTML = '<p><strong>Cris:<\/strong> <\/p>';
              typeWelcome();

              if (input) {
                  input.addEventListener('keypress', async function (e) {
                      if (e.key !== 'Enter') return;
                      var text = input.value.trim();
                      if (!text) return;
                      var youLabel = window.i18n ? window.i18n.t('chat.you') : 'You:';
                      chat.innerHTML += '<p><strong>' + youLabel + '<\/strong> ' + text + '<\/p>';
                      input.value = '';
                      try {
                          var res  = await fetch('https://website-f55a.onrender.com/chat', {
                              method:  'POST',
                              headers: { 'Content-Type': 'application/json' },
                              body:    JSON.stringify({ message: text })
                          });
                          var data = await res.json();
                          chat.innerHTML += '<p><strong>Cris:<\/strong> ' + data.reply + '<\/p>';
                      } catch (err) {
                          chat.innerHTML += '<p><strong>Cris:<\/strong> ...<\/p>';
                      }
                      chat.scrollTop = chat.scrollHeight;
                  });
              }

              /* ── Hamburger menu ── */
              var hamburgerBtn = document.getElementById('hamburger-btn');
              var mobileNav    = document.getElementById('mobile-nav');

              hamburgerBtn.addEventListener('click', function () {
                  var isOpen = hamburgerBtn.classList.toggle('open');
                  mobileNav.classList.toggle('open', isOpen);
                  hamburgerBtn.setAttribute('aria-expanded', isOpen);
                  mobileNav.setAttribute('aria-hidden', !isOpen);
                  document.body.style.overflow = isOpen ? 'hidden' : '';
              });

              mobileNav.querySelectorAll('a').forEach(function (link) {
                  link.addEventListener('click', function () {
                      hamburgerBtn.classList.remove('open');
                      mobileNav.classList.remove('open');
                      hamburgerBtn.setAttribute('aria-expanded', 'false');
                      mobileNav.setAttribute('aria-hidden', 'true');
                      document.body.style.overflow = '';
                  });
              });
          });
      </script>

  </body>
